<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050b16" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>时空智能物联网系统 · 平安区</title>
    <script>
      // TEMP-DIAG: 全局错误捕获（排查后移除）
      window.__errs = [];
      window.addEventListener('error', function (e) {
        window.__errs.push('ERR ' + (e.message || '') + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno);
        if (window.__errs.length > 20) window.__errs.shift();
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__errs.push('REJ ' + String(e.reason && e.reason.stack ? e.reason.stack : e.reason).slice(0, 300));
        if (window.__errs.length > 20) window.__errs.shift();
      });
    </script>
    <script>
      // 首帧前应用主题，避免刷新时闪错主题
      document.documentElement.dataset.theme =
        (function () {
          try { return localStorage.getItem('stiot-theme'); } catch (e) { return null; }
        })() || 'dark';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
