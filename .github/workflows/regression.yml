name: Regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: regression
          POSTGRES_PASSWORD: regression-ci-only
          POSTGRES_DB: iot_regression_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U regression -d iot_regression_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://regression:regression-ci-only@127.0.0.1:5432/iot_regression_test
      TEST_PYTHON: python3
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: npm ci
      - run: python3 -m pip install -r backend/requirements-test.txt
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/prepare-test-db.py
      - run: npm run test:all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-reports
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 14
